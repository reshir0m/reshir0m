<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-labelledby="t">
  <title id="t">Owen W. — Computer Programming Student</title>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="880" height="190" rx="8"/></clipPath>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      .tw1 { animation: tw 3.4s ease-in-out infinite; }
      .tw2 { animation: tw 4.7s ease-in-out infinite; animation-delay: .9s; }
      @keyframes tw { 0%, 100% { opacity: 1 } 55% { opacity: .35 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="190" fill="#0A090C"/>

    <!-- title bar -->
    <rect width="880" height="30" fill="#17131B"/>
    <rect y="29" width="880" height="1" fill="#403040"/>
    <rect x="12" y="5" width="86" height="20" rx="4" fill="#0A090C" stroke="#403040"/>
    <text class="m" x="55" y="19" font-size="11" fill="#8E7A7A" text-anchor="middle">oblivion</text>
    <text class="m" x="864" y="19" font-size="11" fill="#8E7A7A" opacity=".7" text-anchor="end">~/reshir0m</text>

    <!-- Lyra, with Vega -->
    <g stroke="#403040" stroke-width="1" fill="none">
      <path d="M668 58 L694 88 M694 88 L736 80 M694 88 L708 128 M708 128 L748 120 M748 120 L736 80"/>
    </g>
    <g fill="#8A5B73">
      <circle cx="694" cy="88" r="2.4" class="tw1"/>
      <circle cx="736" cy="80" r="2.1"/>
      <circle cx="708" cy="128" r="2.6" class="tw2"/>
      <circle cx="748" cy="120" r="2.2"/>
    </g>
    <circle cx="668" cy="58" r="8" fill="#F5D9B5" opacity=".12"/>
    <circle cx="668" cy="58" r="4" fill="#F5D9B5"/>
    <text class="m" x="681" y="54" font-size="9" fill="#8E7A7A" opacity=".75">vega</text>
    <g fill="#8E7A7A" opacity=".3">
      <circle cx="806" cy="56" r="1"/>
      <circle cx="828" cy="104" r="1.2"/>
      <circle cx="636" cy="138" r="1"/>
      <circle cx="782" cy="158" r="1.1"/>
      <circle cx="654" cy="166" r="1"/>
    </g>

    <!-- identity -->
    <text class="m" x="40" y="90" font-size="40" font-weight="700" fill="#F4ECE8">Owen W.</text>
    <text class="m" x="42" y="116" font-size="13" fill="#C87A7A" letter-spacing="2">COMPUTER PROGRAMMING STUDENT</text>

    <!-- prompt -->
    <text class="m" x="42" y="148" font-size="12.5" fill="#8E7A7A"><tspan fill="#8A5B73">› </tspan>Python · Bash · C# · Linux · Docker · Proxmox<tspan fill="#C87A7A" class="blink"> ▌</tspan></text>

    <text class="m" x="840" y="176" font-size="10" fill="#8E7A7A" opacity=".5" text-anchor="end">fedora 44 · kde plasma</text>
  </g>

  <rect x="0.5" y="0.5" width="879" height="189" rx="8" fill="none" stroke="#403040"/>
</svg>
